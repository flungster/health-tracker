<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>health-tracker</title>
    <script>
      // Pre-paint theme (M25b): apply the stored choice before React mounts so
      // there is no wrong-theme flash. "system" follows the OS color scheme;
      // ThemeProvider keeps this in sync once loaded (profile + live changes).
      (function () {
        var theme = localStorage.getItem("health-tracker.theme") || "light";
        if (theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
