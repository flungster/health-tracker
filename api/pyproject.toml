[project]
name = "health-tracker-api"
version = "0.3.0"
description = "FastAPI backend for health-tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.35",
    "sqlalchemy>=2.0.52,<2.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "argon2-cffi>=25.1",
    "pyjwt>=2.10",
    "email-validator>=2.2",
    "gpxpy>=1.6.2",
    "fitdecode>=0.11",
    "python-multipart>=0.0.20",
    # Provider adapters (Strava) make outbound HTTPS calls to the user's
    # connected third-party accounts.
    "httpx>=0.28",
    "cryptography>=50.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.17",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "C4", "PT", "W"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` and `Query(...)` in FastAPI argument defaults are the
# framework's injection idiom, not a bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
